{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Municipalidad La Serena{% endblock %}</title>
    <!-- Referencia a Bootstrap CSS Local -->
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <style>
        /* Barra de navegación superior con el color #ad0000 y texto blanco */
        .navbar-custom {
            background-color: #ad0000 !important;
        }
        .navbar-custom .nav-link {
            color: #ffffff !important;
            font-weight: 500;
        }
        .navbar-custom .nav-link:hover {
            color: #ffcccc !important;
        }
        .navbar-brand img {
            max-height: 45px;
            width: auto;
            margin-right: 0; /* Ajustado al quitar el texto */
        }
        
        /* Fondo general de la página en blanco */
        body {
            background-color: #f4f6f9 !important;
        }

        /* Recuadro rojo institucional */
        .card-municipal-rojo {
            background-color: #ad0000 !important;
            color: #ffffff !important;
        }
        .card-municipal-rojo h1, 
        .card-municipal-rojo h2, 
        .card-municipal-rojo p {
            color: #ffffff !important;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">

    <!-- Barra de Navegación Roja -->
    <nav class="navbar navbar-expand-lg navbar-dark navbar-custom shadow-sm mb-4 py-2">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'inicio_solicitudes' %}">
                <img src="{% static 'img/logo.png' %}" alt="Logo Muni La Serena">
                <!-- Se eliminó el span con el texto "Muni La Serena" -->
            </a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'inicio_solicitudes' %}">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'lista_reportes' %}">Reportes</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'panel_monitoreo' %}">Monitoreo</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link px-3" href="{% url 'resumen_monitoreo' %}">Resumen</a>
                    </li>
                </ul>

                <!-- Buscador -->
                <form action="{% url 'buscar_global' %}" method="GET" class="d-flex ms-lg-3 mt-3 mt-lg-0" role="search">
                    <input class="form-control form-control-sm me-2" type="search" name="q" placeholder="Buscar trámite..." aria-label="Search" required>
                    <button class="btn btn-outline-light btn-sm" type="submit">Buscar</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Contenido Dinámico Principal -->
    <main class="container flex-grow-1 my-3">
        {% block contenido %}
        {% endblock %}
    </main>

    <!-- Pie de Página Institucional -->
    <footer class="bg-dark text-white text-center py-4 mt-5 shadow-inner">
        <div class="container">
            <p class="mb-1 fw-bold">Ilustre Municipalidad de La Serena</p>
            <p class="mb-0 text-muted small">&copy; 2026 - Todos los derechos reservados.</p>
        </div>
    </footer>

    <!-- Referencia a Bootstrap JS Local -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
